<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>EvenScriptable</title>
    <style>
      /* Even app phone-side tokens (official design-guidelines skill). */
      :root {
        --text: #232323; --text-dim: #7B7B7B; --bg: #FFFFFF; --surface: #EEEEEE;
        --input: rgba(35, 35, 35, 0.08); --accent: #FEF991; --on-accent: #232323;
      }
      @media (prefers-color-scheme: dark) {
        :root { --text: #FFFFFF; --text-dim: #8A8A8A; --bg: #111111; --surface: #1A1A1A; --input: rgba(255, 255, 255, 0.08); }
      }
      html, body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        letter-spacing: -0.01em;
        /* Kill WebView zoom + iOS auto-sizing + rubber-band scroll (from Even's template). */
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }
      [hidden] { display: none !important; } /* the hidden attribute must win over the display rules below */
      #app { padding: 20px; box-sizing: border-box; max-width: 640px; margin: 0 auto; }
      h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 4px; }
      h2 { font-size: 18px; font-weight: 500; margin: 16px 0 8px; }
      section { margin-top: 16px; }
      code, .mono { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
      .dim { color: var(--text-dim); font-size: 13px; }
      .small { font-size: 13px; }
      .note { font-size: 13px; color: var(--text-dim); min-height: 1em; margin: 8px 0; }
      .notice { padding: 12px 16px; border-radius: 12px; background: var(--surface); color: #d93025; font-size: 14px; margin: 12px 0 0; }
      .hint { font-size: 13px; color: var(--text-dim); margin-top: 24px; }
      .row { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; align-items: center; }
      .row.nowrap { flex-wrap: nowrap; }
      .row.spread { justify-content: space-between; }
      .grow { flex: 1; }
      input, textarea {
        flex: 1; min-width: 0; box-sizing: border-box; width: 100%; padding: 12px; border: 0; border-radius: 12px;
        background: var(--input); color: var(--text); font: inherit; margin: 6px 0;
      }
      textarea { min-height: 240px; font: 13px/1.4 ui-monospace, Menlo, monospace; }
      label { display: block; font-size: 13px; color: var(--text-dim); margin-top: 12px; }
      button {
        min-height: 40px; padding: 8px 14px; border: 0; border-radius: 12px; background: var(--surface);
        color: var(--text); font: inherit; font-size: 15px;
      }
      button.accent { background: var(--accent); color: var(--on-accent); font-weight: 500; }
      button.danger { color: #d93025; }
      /* Tabs: a segmented control at the top (not a bottom bar, which could clash with the Even app's own) */
      .tabs { display: flex; gap: 4px; padding: 4px; margin-top: 16px; border-radius: 14px; background: var(--input); }
      .tab { flex: 1; min-height: 36px; background: transparent; color: var(--text-dim); }
      .tab.active { background: var(--bg); color: var(--text); font-weight: 500; }
      .list { list-style: none; padding: 0; margin: 0; }
      .list li { background: var(--surface); border-radius: 12px; padding: 16px; margin: 8px 0; }
      .list .name { font-weight: 500; overflow-wrap: anywhere; }
      .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
      .badges { display: flex; gap: 6px; flex-wrap: wrap; }
      .badge { font-size: 11px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 8px;
        border-radius: 8px; background: var(--input); color: var(--text-dim); }
      .actions, .more { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
      .more { padding-top: 12px; border-top: 1px solid var(--input); }
      .result { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--input); font-size: 13px; }
      .result.error pre { color: #d93025; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0 0; font: 13px/1.4 ui-monospace, Menlo, monospace; }
      .panel { border: 2px solid var(--accent); border-radius: 12px; padding: 12px; margin: 8px 0; }
      .panel h2 { margin: 0; }
      .status { padding: 12px 16px; border-radius: 12px; background: var(--surface); font-weight: 500; }
      .status.ok { box-shadow: inset 4px 0 0 var(--accent); }
      .status.error { color: #d93025; }
      .status.unset, .status.checking { color: var(--text-dim); }
      .steps { padding-left: 20px; }
      .steps li { margin: 12px 0; }
      /* The editor: a full-screen sheet with Cancel / Save */
      .sheet { position: fixed; inset: 0; z-index: 10; background: var(--bg); padding: 12px 20px 20px; box-sizing: border-box;
        display: flex; flex-direction: column; overflow-y: auto; }
      .sheet-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .sheet-bar h2 { margin: 0; }
      .grow-label { flex: 1; display: flex; flex-direction: column; }
      .grow-label textarea { flex: 1; }
      body.sheet-open { overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="app">Loading…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
