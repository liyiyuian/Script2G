<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>EvenScriptable</title>
    <style>
      /* Even app phone-side tokens (official design-guidelines skill). */
      :root {
        --text: #232323; --text-dim: #7B7B7B; --bg: #FFFFFF; --surface: #EEEEEE;
        --input: rgba(35, 35, 35, 0.08); --accent: #FEF991; --on-accent: #232323;
      }
      @media (prefers-color-scheme: dark) {
        :root { --text: #FFFFFF; --text-dim: #8A8A8A; --bg: #111111; --surface: #1A1A1A; --input: rgba(255, 255, 255, 0.08); }
      }
      html, body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        letter-spacing: -0.01em;
        /* Kill WebView zoom + iOS auto-sizing + rubber-band scroll (from Even's template). */
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }
      #app { padding: 20px; box-sizing: border-box; }
      h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 4px; }
      h2 { font-size: 18px; font-weight: 500; margin: 0 0 8px; }
      section { margin-top: 24px; }
      .dim { color: var(--text-dim); font-size: 13px; }
      .row { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
      input, textarea {
        flex: 1; min-width: 0; box-sizing: border-box; width: 100%; padding: 12px; border: 0; border-radius: 12px;
        background: var(--input); color: var(--text); font: inherit; margin: 4px 0;
      }
      textarea { min-height: 240px; font: 13px/1.4 ui-monospace, Menlo, monospace; }
      button {
        padding: 10px 14px; border: 0; border-radius: 12px; background: var(--surface); color: var(--text); font: inherit; font-size: 14px;
      }
      button.accent { background: var(--accent); color: var(--on-accent); }
      .panel { border: 2px solid var(--accent); border-radius: 12px; padding: 12px; margin: 8px 0; }
      .panel h2 { margin: 0; }
      .row.spread { justify-content: space-between; align-items: center; }
      .list { list-style: none; padding: 0; margin: 0; }
      .list li { background: var(--surface); border-radius: 12px; padding: 12px 16px; margin: 8px 0; }
      .list .name { display: block; font-weight: 500; overflow-wrap: anywhere; }
      .list .actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
      .list .actions button { padding: 6px 10px; font-size: 13px; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface); border-radius: 12px; padding: 12px; margin: 0; }
    </style>
  </head>
  <body>
    <div id="app">Loading…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
